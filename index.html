  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CashTrace - Native Android Expense Tracker</title>
    <meta name="description" content="Production-grade native Android (Kotlin, Jetpack Compose, Room, WorkManager) offline SMS expense tracker with overlay popup, persistent notifications, and APK build pipeline." />
    <meta property="og:title" content="CashTrace - Native Android Expense Tracker" />
    <meta property="og:description" content="Production-grade native Android (Kotlin, Jetpack Compose, Room, WorkManager) offline SMS expense tracker with overlay popup, persistent notifications, and APK build pipeline." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Guard against browser extensions attempting to assign window.fetch when it has only a getter
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(fn) { currentFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Prevent extension errors from surfacing in app error overlay
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
